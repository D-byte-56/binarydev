<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Binarydev</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#120d0a">
  <!-- Rutas absolutas: la 404 puede servirse desde cualquier ruta -->
  <link rel="icon" href="/binarydev/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/binarydev/img/favicon-32.png">
  <link rel="preload" href="/binarydev/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/binarydev/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/binarydev/css/estilos.css">
</head>
<body>
  <main class="pagina-error">
    <div class="contenedor pagina-error__caja">
      <a href="/binarydev/" class="marca" aria-label="Binarydev, ir al inicio">
        <img class="marca__img" src="/binarydev/img/logo-mark.png" alt="" width="40" height="33" decoding="async">
        <span class="marca__texto" aria-hidden="true">BINARY<span>DEV</span></span>
      </a>
      <p class="pagina-error__codigo">404</p>
      <h1 class="pagina-error__titulo">Esta página no existe</h1>
      <p class="pagina-error__texto">Puede que el enlace esté roto o que la página se haya movido. Volvamos a un lugar seguro.</p>
      <div class="botones">
        <a href="/binarydev/" class="btn btn--primario">Ir al inicio</a>
        <a href="/binarydev/#contacto" class="btn btn--secundario">Contáctanos</a>
      </div>
    </div>
  </main>
</body>
</html>
